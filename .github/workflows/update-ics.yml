name: Aktualizuj plan zajęć

# Kiedy się uruchamia:
#  - codziennie o 06:00 UTC (08:00 w Polsce latem, 07:00 zimą),
#  - sam, gdy zmienisz USTAWIENIA.toml, wrzucisz plik do WF/ albo zmienisz skrypty,
#  - ręcznie: Actions → „Aktualizuj plan zajęć” → Run workflow.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "USTAWIENIA.toml"
      - "WF/**"
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/update-ics.yml"

concurrency:
  group: update-ics
  cancel-in-progress: false

jobs:
  update-ics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pełna historia: po niej poznajemy najnowszy plik WF

      - name: Konfiguracja Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      # Jeśli tu coś padnie, kalendarz zostaje w ostatniej dobrej wersji.
      - name: Pobierz plany i zbuduj kalendarz
        run: python aktualizuj.py

      - name: Commit, jeśli kalendarz albo foldery WF się zmieniły
        run: |
          if [ -z "$(git status --porcelain -- '*.ics' WF)" ]; then
            echo "Brak zmian w kalendarzu – bez commitu."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.ics' WF dane
          git commit -m "auto: aktualizacja planu $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push

      # ---------- GitHub Pages (subskrypcja webcal dla iOS) ----------

      - name: Przygotuj pliki do Pages
        run: |
          mkdir -p _site
          cp *.ics _site/

      - name: Konfiguracja Pages
        uses: actions/configure-pages@v5

      - name: Upload artefaktu Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
